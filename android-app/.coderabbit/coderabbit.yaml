version: 1
language: kotlin
project_type: android

reviews:
  profile: assertive
  auto_review: false
  deep_scan: true
  ai_enhancement: true
  optimization_suggestions: true
  unused_analysis: true
  quality_score: true

tools:
  semgrep: true
