name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code'
        required: false
        default: '1'
      version_name:
        description: 'Version Name'
        required: false
        default: '1.0.0'
  push:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/build-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Gradle properties
        run: |
          cat <<'PROP_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          PROP_EOF

      - name: Configure release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          rm -f release.keystore
          CLEAN_B64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          if [ -n "$CLEAN_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && printf '%s' "$CLEAN_B64" | base64 -d > release.keystore 2>/dev/null && [ -s release.keystore ]; then
            echo "Using configured release keystore from secrets."
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS:-release}" >> "$GITHUB_ENV"
          else
            echo "Generating temporary CI keystore for release packaging."
            rm -f release.keystore
            keytool -genkeypair -v -keystore release.keystore \
              -alias release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci_temp_store_pass -keypass ci_temp_key_pass \
              -dname "CN=AgenticOS CI, OU=Dev, O=AgenticOS, L=Vijayawada, S=AP, C=IN"
            echo "KEYSTORE_PASSWORD=ci_temp_store_pass" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=ci_temp_key_pass" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=release" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agentic-os-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          retention-days: 30
